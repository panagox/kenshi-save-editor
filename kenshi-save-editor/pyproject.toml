[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenshi-save-editor"
version = "0.1.0"
description = "Desktop reader for Kenshi save folders. Phase 1: read-only character and squad browser."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kenshi-save-editor = "kenshi_save_editor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
